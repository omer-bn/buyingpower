name: Clone source repository

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/clone-source.yml'

permissions:
  contents: write

jobs:
  clone-source:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip clone]')"
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        run: |
          rm -rf /tmp/source
          git clone --depth 1 https://github.com/bennuno-ops/Buying_power.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/source/. .

      - name: Commit cloned source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clone Buying_power source [skip clone]' || exit 0
          git push origin main
